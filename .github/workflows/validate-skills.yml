name: Validate skills registry

on:
  push:
    paths:
      - "skills/**"
      - "scripts/**"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get install -y jq
      - name: Auto-translate PT-BR to EN-US (ADR-026 if key available)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            python3 scripts/translate_catalog_nim.py
          else
            echo "ℹ️  NVIDIA_API_KEY not set. Running translation check in dry-run mode."
            python3 scripts/translate_catalog_nim.py --dry-run || true
          fi
      - name: Validate skills/index.json against real files
        run: |
          chmod +x scripts/sync-index.sh
          chmod +x scripts/validate-index.sh
          ./scripts/sync-index.sh
          ./scripts/validate-index.sh
      - name: Validate skill quality (Ultra-High Quality Grade)
        run: |
          chmod +x scripts/validate-skill.sh
          ERRORS=0
          for skill_dir in skills/*/; do
            if [ -f "$skill_dir/SKILL.md" ]; then
              echo "🔍 Validating: $skill_dir"
              if ! ./scripts/validate-skill.sh "$skill_dir"; then
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS skill(s) failed quality validation"
            exit 1
          fi
          echo "✅ All skills passed quality validation"
      - name: Run automated test suite
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_*.py"
